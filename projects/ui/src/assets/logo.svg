<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Thock app icon: a Cherry-profile mechanical keycap with a T legend, on the macOS squircle. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#33373f"/>
      <stop offset="1" stop-color="#0f1115"/>
    </linearGradient>
    <linearGradient id="top" gradientUnits="userSpaceOnUse" x1="0" y1="184" x2="0" y2="648">
      <stop offset="0" stop-color="#4bebbe"/>
      <stop offset="1" stop-color="#2fcfa3"/>
    </linearGradient>
    <linearGradient id="front" gradientUnits="userSpaceOnUse" x1="0" y1="600" x2="0" y2="812">
      <stop offset="0" stop-color="#22ad86"/>
      <stop offset="1" stop-color="#178f6d"/>
    </linearGradient>
    <linearGradient id="sides" gradientUnits="userSpaceOnUse" x1="0" y1="196" x2="0" y2="812">
      <stop offset="0" stop-color="#1f9f7b"/>
      <stop offset="1" stop-color="#136f55"/>
    </linearGradient>
    <radialGradient id="dish" cx="0.5" cy="0.42" r="0.6">
      <stop offset="0" stop-color="#000" stop-opacity="0.10"/>
      <stop offset="0.7" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-30%" y="-60%" width="160%" height="220%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
  </defs>

  <!-- macOS icon shape -->
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>

  <!-- contact shadow under the cap -->
  <ellipse cx="512" cy="790" rx="330" ry="60" fill="#000" opacity="0.55" filter="url(#blur)"/>

  <!-- Faces are polygons drawn with a thick round-joined stroke of their own colour:
       stroke-width 2r gives rounded corners without arc math. -->
  <!-- whole cap silhouette = the two side faces -->
  <polygon points="288,232 736,232 824,412 824,776 200,776 200,412"
           fill="url(#sides)" stroke="url(#sides)" stroke-width="72" stroke-linejoin="round"/>
  <!-- front face -->
  <polygon points="288,600 736,600 824,776 200,776"
           fill="url(#front)" stroke="url(#front)" stroke-width="72" stroke-linejoin="round"/>
  <!-- top face -->
  <polygon points="288,232 736,232 736,600 288,600"
           fill="url(#top)" stroke="url(#top)" stroke-width="96" stroke-linejoin="round"/>
  <!-- slight concave dish on the top face -->
  <rect x="240" y="184" width="544" height="464" rx="48" fill="url(#dish)"/>
  <!-- back-edge highlight -->
  <line x1="300" y1="186" x2="724" y2="186" stroke="#fff" stroke-opacity="0.35" stroke-width="6" stroke-linecap="round"/>

  <!-- legend: T -->
  <polygon points="372,300 652,300 652,372 552,372 552,560 472,560 472,372 372,372"
           fill="#0f1a17" stroke="#0f1a17" stroke-width="18" stroke-linejoin="round"/>
</svg>
